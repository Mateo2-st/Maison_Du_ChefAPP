<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tu carrito</title>
  <link rel="stylesheet" href="../css/carrito.css">
</head>
<body>

<div class="container">

  <div class="cart-header">
    <h1>🛒 Tu carrito</h1>
    <button class="back-btn" onclick="location.href='catalogo.html'">
      ← Volver al catálogo
    </button>
  </div>

  <div class="cart">
    <ul id="cart-items"></ul>

    <div class="total">
      <span>Total:</span>
      <span>$<span id="total">0</span></span>
    </div>

    <div class="address-section">
      <label for="direccion">Dirección de entrega:</label>
      <input type="text" id="direccion" class="address-input" placeholder="Ingresa tu dirección de entrega" required>
    </div>

    <button id="checkoutBtn" class="checkout-btn full">
      Finalizar compra
    </button>
  </div>
</div>

<!-- ===== MODAL PAGO ===== -->
<div id="paymentModal" class="modal">
  <div class="modal-overlay"></div>
  <div class="modal-box">
    <button class="modal-close" onclick="closePaymentModal()">×</button>

    <h2>Selecciona método de pago</h2>
    <p class="payment-total">
      Total a pagar: <strong>$<span id="paymentTotal">0</span></strong>
    </p>

    <div class="payment-methods">
      <button class="checkout-btn" onclick="payCash()">💵 Efectivo</button>
      <button class="checkout-btn" onclick="showCard()">💳 Tarjeta</button>
    </div>

    <!-- TARJETA -->
    <div id="cardForm" class="hidden">
      <div class="card-fields">
        <input type="text" placeholder="Número de tarjeta">
        <input type="text" placeholder="Nombre">
        <input type="text" placeholder="MM/AA">
        <input type="text" placeholder="CVV">
      </div>
      <button class="checkout-btn full" onclick="payCard()">Pagar</button>
    </div>
  </div>
</div>

<!-- ===== MODAL ÉXITO ===== -->
<div id="successModal" class="modal">
  <div class="modal-overlay"></div>
  <div class="modal-box success-box">
    <h2>✅ Pago exitoso</h2>
    <p>Gracias por tu compra</p>
    <button class="checkout-btn full" onclick="finish()">Volver al catálogo</button>
  </div>
</div>

<script src="../js/carrito/carrito.js"></script>
</body>
</html>
