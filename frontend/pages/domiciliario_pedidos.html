<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pedidos disponibles - Domiciliario</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="../css/domiciliario_pedidos.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

<header class="topbar">
  <h1>Pedidos disponibles</h1>
  <div class="header-actions">
    <button id="btnVolverCatalogo" type="button" title="Volver al catálogo">
      <i class="fa-solid fa-arrow-left"></i>
    </button>
    <button id="btnCerrarSesion" type="button" title="Cerrar sesión">
      <i class="fa-solid fa-right-from-bracket"></i>
    </button>
  </div>
</header>

<main class="container">

  <div id="ctaLogin" class="ctaLogin oculto">
    <p>Inicia sesión para aceptar pedidos y gestionar entregas.</p>
    <button id="btnIrLogin" class="btn-primary">Iniciar sesión</button>
  </div>


  <div id="sinPedidos" class="sinPedidos oculto">
    <i class="fa-solid fa-motorcycle"></i>
    <p>No hay pedidos disponibles por ahora</p>
  </div>

  <div id="listaPedidos" class="listaPedidos"></div>

</main>

<script src="../js/domiciliario_pedidos.js"></script>
</body>
</html>
