<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registro de Domiciliario</title>

  <link rel="stylesheet" href="../css/formularios_general.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

  <header class="formTopbar">
    <button class="backBtn" onclick="window.location.href='../pages/catalogo.html'">
      <i class="fa-solid fa-arrow-left"></i> Volver
    </button>
    <h1>Registro de domiciliario</h1>
  </header>

  <main class="wrap">
    <section class="card">
      <h2>Datos personales</h2>
      <p class="muted">Completa la información para aplicar.</p>

      <form id="formDomiciliario" class="formGrid">

        <div class="field">
          <label>Nombre completo</label>
          <input name="nombre" type="text" required placeholder="Nombre completo"/>
        </div>

        <div class="field">
          <label>Número de cédula</label>
          <input name="cedula" type="text" required placeholder="Cédula"/>
        </div>

        <div class="field">
          <label>Teléfono</label>
          <input name="telefono" type="tel" required placeholder="Teléfono"/>
        </div>

        <div class="field">
          <label>Dirección de residencia</label>
          <input name="direccion" type="text" required placeholder="Dirección"/>
        </div>

        <div class="field">
          <label>Localidad</label>
          <input name="localidad" type="text" required placeholder="Localidad"/>
        </div>

        <div class="field">
          <label>Barrio</label>
          <input name="barrio" type="text" required placeholder="Barrio"/>
        </div>

        <div class="divider"></div>
        <h3 class="subTitle">Vehículo</h3>

        <div class="field">
          <label>Tipo de vehículo</label>
          <select name="tipo_vehiculo" required>
            <option value="">Selecciona</option>
            <option value="Moto">Moto</option>
            <option value="Carro">Carro</option>
            <option value="Bicicleta">Bicicleta</option>
          </select>
        </div>

        <div class="field">
          <label>Marca del vehículo</label>
          <input name="marca_vehiculo" type="text" required placeholder="Marca del vehículo"/>
        </div>

        <div class="field">
          <label>Placa (si aplica)</label>
          <input name="placa" type="text" placeholder="Placa (opcional)"/>
        </div>

        <div class="divider"></div>
        <h3 class="subTitle">Licencia</h3>

        <div class="field">
          <label>¿Tiene licencia de conducir?</label>
          <select name="tiene_licencia" required>
            <option value="">Selecciona</option>
            <option value="Sí">Sí</option>
            <option value="No">No</option>
          </select>
        </div>

        <div class="field">
          <label>Fecha de expedición (si aplica)</label>
          <input name="fecha_expedicion" type="date" />
          <small class="help">Si no tiene licencia, deja este campo vacío.</small>
        </div>

        <div class="field">
          <label>Experiencia realizando domicilios</label>
          <select name="experiencia" required>
            <option value="">Selecciona</option>
            <option value="4-7 meses">4-7 meses</option>
            <option value="8-11 meses">8-11 meses</option>
            <option value="1-3 años">1-3 años</option>
            <option value="4-6 años">4-6 años</option>
            <option value="7+ años">7+ años</option>
          </select>
        </div>

        <div class="actions">
          <button class="btnPrimary" type="submit">Enviar</button>
        </div>

      </form>
    </section>
  </main>

  <script src="../js/registro_domiciliario.js"></script>
</body>
</html>
