<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Admin | Informes</title>
  <link rel="stylesheet" href="../css/informes.css">
</head>
<body>

<header class="header">
  <h1>Informes de Ventas</h1>
  <p>Panel administrativo · Análisis y rendimiento</p>
</header>

<section class="filters">
  <div class="filter-group">
    <label>Desde</label>
    <input type="date" id="fechaInicio">
  </div>

  <div class="filter-group">
    <label>Hasta</label>
    <input type="date" id="fechaFin">
  </div>

  <div class="filter-group">
    <label>Método de Pago</label>
    <select id="pagoSelect">
      <option value="">Todos</option>
      <option value="tarjeta">Tarjeta</option>
      <option value="efectivo">Efectivo</option>
      <option value="transferencia">Transferencia</option>
    </select>
  </div>

  <button id="btnFiltrar">Aplicar filtros</button>
</section>

<section class="summary">
  <div>
    <span>Ingresos Totales</span>
    <strong id="totalVentas">$0</strong>
  </div>
  <div>
    <span>Pedidos</span>
    <strong id="totalPedidos">0</strong>
  </div>
  <div>
    <span>Pago más usado</span>
    <strong id="pagoFrecuente">-</strong>
  </div>
</section>

<section class="panel">
  <h2>Pedidos</h2>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Usuario</th>
        <th>Dirección</th>
        <th>Fecha</th>
        <th>Estado</th>
      </tr>
    </thead>
    <tbody id="tablaPedidos"></tbody>
  </table>
</section>

<!-- 🔥 IMPORTANTE: app.js PRIMERO -->
<script src="../js/app.js"></script>
<script src="../js/administrador/informes.js"></script>

</body>
</html>
