<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registro de Restaurante</title>

  <link rel="stylesheet" href="../css/formularios_general.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

  <header class="formTopbar">
    <button class="backBtn" onclick="window.location.href='catalogo.html'">
      <i class="fa-solid fa-arrow-left"></i> Volver
    </button>
    <h1>Registrar restaurante</h1>
  </header>

  <main class="wrap">
    <section class="card">
      <h2>Datos del restaurante</h2>
      <p class="muted">Completa la información para enviar tu solicitud.</p>

      <form id="formRestaurante" class="formGrid">

        <div class="field">
          <label>Nombre del restaurante</label>
          <input name="nombre_restaurante" type="text" required placeholder="Nombre del restaurante"/>
        </div>

        <div class="field">
          <label>Categorías que maneja</label>
          <select name="categorias" multiple required>
            <option value="Desayunos">Desayunos</option>
            <option value="Almuerzos">Almuerzos</option>
            <option value="Carnes">Carnes</option>
            <option value="Pastas">Pastas</option>
            <option value="Pescados">Pescados</option>
            <option value="Bebidas">Bebidas</option>
            <option value="Comida rápida">Comida rápida</option>
            <option value="Postres">Postres</option>
            <option value="Picadas">Picadas</option>
            <option value="Ensaladas">Ensaladas</option>
            <option value="Vegetariana">Vegetariana</option>
          </select>
          <small class="help">Puedes seleccionar varias categorías.</small>
        </div>

        <div class="field">
          <label>Tiempo de experiencia</label>
          <select name="experiencia" required>
            <option value="">Selecciona</option>
            <option value="4-7 meses">4-7 meses</option>
            <option value="8-11 meses">8-11 meses</option>
            <option value="1-3 años">1-3 años</option>
            <option value="4-6 años">4-6 años</option>
            <option value="7+ años">7+ años</option>
          </select>
        </div>

        <div class="divider"></div>

        <h3 class="subTitle">Propietario</h3>

        <div class="field">
          <label>Nombre del propietario</label>
          <input name="nombre_propietario" type="text" required placeholder="Nombre completo"/>
        </div>

        <div class="field">
          <label>Número de cédula</label>
          <input name="cedula" type="text" required placeholder="Cédula"/>
        </div>

        <div class="field">
          <label>Teléfono</label>
          <input name="telefono" type="tel" required placeholder="Teléfono"/>
        </div>

        <div class="field">
          <label>Dirección de residencia</label>
          <input name="direccion_residencia" type="text" required placeholder="Dirección de residencia"/>
        </div>

        <div class="field">
          <label>Dirección del restaurante</label>
          <input name="direccion_restaurante" type="text" required placeholder="Dirección del restaurante"/>
          <small class="help">Si es la misma, vuelve a escribirla.</small>
        </div>

        <div class="actions">
          <button class="btnPrimary" type="submit">Enviar</button>
        </div>

      </form>
    </section>
  </main>

  <script src="../js/registro_restaurante.js"></script>
</body>
</html>
