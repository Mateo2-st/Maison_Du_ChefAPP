<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestión de Personal - Admin</title>

  <!-- Estilos -->
  <link rel="stylesheet" href="../css/admin_personal.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

  <!-- ===== SIDEBAR DEL ADMIN ===== -->
  <aside class="admin-sidebar">
    <div class="admin-logo">
      <img src="../imagenes/imagen logo/logo.png" alt="Maison Du Chef">
      <h2>Administrador</h2>
    </div>

    <ul class="admin-menu">
      <li><a href="cuenta_administrador.html"><i class="fa-solid fa-gauge"></i> Panel General</a></li>
      <li><a class="active" href="admin_personal.html"><i class="fa-solid fa-user-gear"></i> Gestión de Personal</a></li>
      <li><a href="admin_contenido.html"><i class="fa-solid fa-bowl-food"></i> Restaurantes & Platos</a></li>
      <li><a href="informes_admin.html"><i class="fa-solid fa-chart-line"></i> Informes de ventas</a></li>
      <li><a href="configuracion.html"><i class="fa-solid fa-wrench"></i> Configuración</a></li>
    </ul>

    <button id="btnLogoutAdmin" class="admin-logout">
      <i class="fa-solid fa-right-from-bracket"></i> Cerrar sesión
    </button>
  </aside>

  <!-- ===== CONTENIDO PRINCIPAL ===== -->
  <main class="admin-main">
    <h1 class="admin-title">Gestión de Personal</h1>
    <p class="admin-subtitle">Control de usuarios y roles</p>

    <!-- FILTRO POR ROL -->
    <div class="filter-box">
      <label><strong>Filtrar por rol:</strong></label><br>
      <select id="filtroRol" class="admin-select">
        <option value="todos">Todos</option>
        <option value="usuario">Usuarios</option>
        <option value="vendedor">Vendedores</option>
        <option value="domiciliario">Domiciliarios</option>
        <option value="admin">Administradores</option>
      </select>
    </div>

    <!-- TABLA DE USUARIOS -->
    <table class="admin-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Correo</th>
          <th>Rol</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tablaUsuarios"></tbody>
    </table>
  </main>

  <!-- ===== SCRIPTS ===== -->
<script>
document.addEventListener("DOMContentLoaded", async () => {
  // ===== TOKEN Y SESIÓN =====
  let token = localStorage.getItem("mdc_token");
  let session = JSON.parse(localStorage.getItem("mdc_session") || "null");

  // Si no hay token o sesión, redirigir
  if (!token || !session || session.rol !== "admin") {
    Swal.fire({
      icon: 'error',
      title: 'Acceso denegado',
      text: 'No tienes permisos.'
    }).then(() => window.location.href = "login.html");
    return;
  }

  const tabla = document.getElementById("tablaUsuarios");
  const filtro = document.getElementById("filtroRol");

  // ===== CARGAR USUARIOS =====
  async function cargarUsuarios() {
    try {
      const res = await fetch("http://localhost:3000/api/users", {
        headers: { Authorization: `Bearer ${token}` }
      });

      if (!res.ok) {
        const text = await res.text();
        console.error("Error backend:", text);
        throw new Error("No se pudo cargar la lista de usuarios");
      }

      const users = await res.json();
      const rolFiltro = filtro.value;
      tabla.innerHTML = "";

      users
        .filter(u => rolFiltro === "todos" || u.rol === rolFiltro)
        .forEach(u => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${u.idUsuario}</td>
            <td>${u.nombre}</td>
            <td>${u.correo}</td>
            <td>${u.rol}</td>
            <td>
              <button class="admin-btn" onclick="editarUsuario('${u.idUsuario}')">Editar</button>
              <button class="admin-btn-admin" onclick="eliminarUsuario('${u.idUsuario}')">Eliminar</button>
            </td>
          `;
          tabla.appendChild(tr);
        });

    } catch (err) {
      console.error(err);
      Swal.fire("Error", err.message, "error");
    }
  }

  // ===== FILTRO POR ROL =====
  filtro.addEventListener("change", cargarUsuarios);
  await cargarUsuarios();

  // ===== EDITAR USUARIO =====
  window.editarUsuario = async function(id) {
    try {
      const res = await fetch(`http://localhost:3000/api/users/${id}`, {
        headers: { Authorization: `Bearer ${token}` }
      });

      if (!res.ok) throw new Error("No se pudo obtener el usuario");
      const user = await res.json();

      const { value: formValues } = await Swal.fire({
        title: "Editar Usuario",
        html: `
          <input id="editRol" class="swal2-input" placeholder="Rol" value="${user.rol}">
          <input id="editPass" class="swal2-input" placeholder="Nueva contraseña (opcional)">
        `,
        focusConfirm: false,
        showCancelButton: true,
        preConfirm: () => {
          return {
            rol: document.getElementById("editRol").value,
            password: document.getElementById("editPass").value
          };
        }
      });

      if (!formValues) return;

      const updateRes = await fetch(`http://localhost:3000/api/users/${id}`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          Authorization: `Bearer ${token}`
        },
        body: JSON.stringify(formValues)
      });

      if (!updateRes.ok) throw new Error("No se pudo actualizar el usuario");

      Swal.fire("Guardado", "Los cambios fueron aplicados correctamente.", "success");
      cargarUsuarios();

    } catch (err) {
      console.error(err);
      Swal.fire("Error", err.message || "No se pudo editar el usuario", "error");
    }
  };

  // ===== ELIMINAR USUARIO =====
  window.eliminarUsuario = async function(id) {
    const confirm = await Swal.fire({
      title: "¿Eliminar este usuario?",
      text: "Esta acción no se puede deshacer.",
      icon: "warning",
      showCancelButton: true,
      confirmButtonText: "Sí, eliminar",
      cancelButtonText: "Cancelar"
    });

    if (!confirm.isConfirmed) return;

    try {
      const res = await fetch(`http://localhost:3000/api/users/${id}`, {
        method: "DELETE",
        headers: { Authorization: `Bearer ${token}` }
      });

      if (!res.ok) throw new Error("No se pudo eliminar el usuario");

      Swal.fire("Eliminado", "El usuario ha sido eliminado.", "success");
      cargarUsuarios();

    } catch (err) {
      console.error(err);
      Swal.fire("Error", err.message, "error");
    }
  };

  // ===== CERRAR SESIÓN =====
  document.getElementById("btnLogoutAdmin")?.addEventListener("click", () => {
    Swal.fire({
      title: "Cerrar sesión",
      text: "¿Seguro deseas salir?",
      icon: "warning",
      showCancelButton: true,
      confirmButtonText: "Sí",
      cancelButtonText: "Cancelar"
    }).then(r => {
      if (r.isConfirmed) {
        localStorage.removeItem("mdc_token");
        localStorage.removeItem("mdc_session");
        window.location.href = "login.html";
      }
    });
  });
});
</script>

</body>
</html>
