<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cambiar Teléfono</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/telefono.css">
</head>
<body>

  <!-- Header -->
  <header class="cart-header">
    <a href="/cuenta/cuenta.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
    <h2>Cambiar Teléfono</h2>
    <button class="logout-btn" onclick="cerrarSesion()">Cerrar Sesión</button>
  </header>

  <!-- Contenido -->
  <main class="cart-container">
    <div class="form-card">
      <label for="tel-actual">Teléfono Actual:</label>
      <input type="tel" id="tel-actual" placeholder="Ingresa tu teléfono actual">

      <label for="tel-nuevo">Nuevo teléfono:</label>
      <input type="tel" id="tel-nuevo" placeholder="Ingresa tu nuevo teléfono">

      <button class="btn" onclick="confirmarCambioTelefono()">Confirmar cambio</button>
    </div>
  </main>

  <script src="../js/telefono/telefono.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../js/app.js"></script>

</body>
</html>
