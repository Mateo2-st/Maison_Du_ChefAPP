<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CATÁLOGO</title>

  <link rel="stylesheet" href="../css/maison.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>

<!-- ===== HEADER / CARRUSEL ===== -->
<div class="carousel-container">
  <header class="overlay-header">
    <div class="logo">CATÁLOGO</div>

    <nav class="navbar">
      <a href="../pages/catalogo.html" class="nav-icon">
        <i class="fa-solid fa-house"></i>
      </a>

      <input type="text" placeholder="Buscar..." class="search-bar">

      <a href="../pages/carrito.html" class="nav-icon">
        <i class="fa-solid fa-cart-shopping"></i>
        <span id="cartCountHeader" class="cart-count">0</span>
      </a>

      <!-- 👇 NO SE CAMBIA -->
      <a href="../pages/login.html" id="logoutBtn" class="logout-btn">
        <i class="fa-solid fa-right-from-bracket"></i> Cerrar sesión
      </a>
    </nav>
  </header>

  <div class="carousel-images">
    <img src="../imagenes/IMG carrusel/pan.jpg">
    <img src="../imagenes/IMG carrusel/pez.jpg">
    <img src="../imagenes/IMG carrusel/carne.jpg">
    <img src="../imagenes/IMG carrusel/chatarra.jpg">
  </div>
</div>

<!-- ===== RESTAURANTES ===== -->
<section class="restaurants-section">
  <h2 class="section-title">Restaurantes</h2>
  <div id="restaurantsGrid" class="restaurants-grid"></div>
</section>

<!-- ===== MODAL RESTAURANTE ===== -->
<div id="restaurantModal" class="modal">
  <div class="modal-overlay"></div>
  <div class="modal-box">
    <button id="modalCloseBtn" class="modal-close">&times;</button>

    <div class="modal-header">
      <img id="modalLogo" class="modal-logo">
      <div>
        <h2 id="modalName"></h2>
        <p id="modalMeta" class="meta-small"></p>
      </div>
    </div>

    <div id="modalProducts" class="modal-body"></div>
  </div>
</div>

<script src="../js/catalogo/Maison.js"></script>
</body>
</html>
